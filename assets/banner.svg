<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="MCP Smart Vision, an AI agent tool by Isaiah Anson. Gives an AI agent eyes and hands on Windows. 37 working tools, API key on every call, Windows 10/11.">
<title>MCP Smart Vision, an AI agent tool by Isaiah Anson. Gives an AI agent eyes and hands on Windows. 37 working tools, API key on every call, Windows 10/11.</title>
<style>
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes lit{from{opacity:.3}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.in{animation:in .45s ease both}
.lit{animation:lit .45s ease both}
.chip{animation:rise .5s ease 1.9s both}
.halo{animation:pulse 3.4s ease-in-out infinite}
.beat{animation:pulse 2.4s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow .7s cubic-bezier(.3,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){.in,.lit,.chip,.halo,.beat,.grow{animation:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08120e"/><stop offset="0.55" stop-color="#0c1e17"/><stop offset="1" stop-color="#0f2e23"/></linearGradient>
<linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1f18"/><stop offset="1" stop-color="#144231"/></linearGradient>
<radialGradient id="g1" cx="88" cy="86" r="330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4ade80" stop-opacity="0.2"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="900" cy="340" r="340" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#14b8a6" stop-opacity="0.3"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
<radialGradient id="halo" cx="88" cy="86" r="62" gradientUnits="userSpaceOnUse"><stop offset="0.45" stop-color="#4ade80" stop-opacity="0.42"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.5"/></pattern>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/></linearGradient>
<mask id="m"><rect width="960" height="320" fill="url(#fade)"/></mask>
<clipPath id="clip"><rect width="960" height="320" rx="20"/></clipPath>

</defs>
<g clip-path="url(#clip)">
<rect width="960" height="320" fill="url(#bg)"/>
<rect width="960" height="320" fill="url(#dots)" mask="url(#m)"/>
<rect width="960" height="320" fill="url(#g1)"/>
<rect width="960" height="320" fill="url(#g2)"/>
</g>
